<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Prototype</title>
<style>
  :root {
    --bg: #f2f3f7; --panel: #fff; --fg: #1b1e2b; --muted: #5d6275; --line: #cfd2dc; --core: #e4e6ee;
    --p0: #2f5be0; --p1: #c8322f; --p2: #1d8a47; --p3: #b07a12;
    --r-material: #b48a4a; --r-fuel: #e59a3b; --r-weapons: #d0584f; --r-relic: #3aa99b; --r-psionic: #9a5fdc; --r-none: #bbb;
    --err: #b3261e; --ok: #1d6b3a;
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12141c; --panel: #1b1e2a; --fg: #e8e9f0; --muted: #9a9fb4; --line: #3a3f55; --core: #262a3a;
      --p0: #7d9bff; --p1: #ff7b72; --p2: #56d38a; --p3: #f0c050; --err: #ff8a80; --ok: #7fe0a6; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  #app { max-width: 1500px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: 12px; }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  h2 { font-size: 1rem; margin: 0 0 6px; }
  h3 { font-size: .95rem; margin: 0 0 4px; }
  p { margin: 3px 0; }
  ul, ol { margin: 4px 0; padding-left: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 4px 0; }
  label { display: inline-flex; gap: 4px; align-items: center; }
  input[type=number] { width: 60px; }
  input[type=text] { width: 140px; }
  textarea { width: 100%; font: 12px/1.3 ui-monospace, Consolas, monospace; }
  select, input, textarea, button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
  button { cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--p0); }
  .hint { color: var(--muted); font-size: .85rem; }
  .status { color: var(--muted); }
  .msg { padding: 6px 8px; border-radius: 6px; margin-top: 6px; }
  .msg.error { border: 1px solid var(--err); color: var(--err); }
  .msg.info { border: 1px solid var(--ok); color: var(--ok); }
  .big { font-size: 1.2rem; }
  main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  .side { display: grid; gap: 10px; min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .players { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .player { background: var(--panel); border: 2px solid; border-radius: 8px; padding: 8px; }
  .player.active { box-shadow: 0 0 0 3px var(--line); }
  .log ol { max-height: 260px; overflow: auto; font-size: .85rem; }
  .map-col svg { width: 100%; height: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .core { fill: var(--core); }
  .link { stroke: var(--muted); stroke-width: 1.5; fill: none; }
  .link.out { opacity: .2; }
  .link.open { stroke: var(--p0); stroke-dasharray: 6 4; stroke-width: 2.5; }
  .sys { cursor: pointer; }
  .sys .gate { fill: var(--panel); stroke: var(--fg); stroke-width: 2; }
  .sys .planet { stroke: var(--fg); stroke-width: 1.2; fill-opacity: .35; }
  .sys.out { opacity: .25; }
  .sys.sel circle { stroke: var(--p0); stroke-width: 4; }
  .r-material { fill: var(--r-material); } .r-fuel { fill: var(--r-fuel); } .r-weapons { fill: var(--r-weapons); }
  .r-relic { fill: var(--r-relic); } .r-psionic { fill: var(--r-psionic); } .r-none { fill: var(--r-none); }
  .sys-id { font-size: 10px; text-anchor: middle; fill: var(--fg); font-weight: 600; }
  .bld { stroke: var(--fg); stroke-width: 1; }
  .bld.dmg { fill-opacity: .35; stroke-dasharray: 2 2; }
  .bld-t { font-size: 9px; text-anchor: middle; fill: #fff; font-weight: 700; pointer-events: none; }
  .ships { font-size: 11px; text-anchor: middle; font-weight: 700; }
  code { font-size: .9rem; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
