# Where each file in assets/ came from, one entry per file, added with it. The field names are the
# same as a one-shot's provenance record, so a grown game's entries carry over.
# The game imports its assets in the code, so this file never enters a build.
# - path: assets/hit.wav      # relative to the project root
#   origin: ai                # ai | bought | cc0 | you | outsourced | template | plugin | licensed | code | unknown
#   tool: "what made or fetched it: the generator, or the script for code"
#   model: "the model ID, when a model made it or an AI wrote its code"
#   source: {vendor: "who made or sold it", product: "its name", url: "where from"}   # a download
#   licence: {id: CC0-1.0}    # a download: the SPDX id where one exists
#   date: 2026-01-31
#   ships: true               # false for a file only the build uses
#   placeholder: true         # until it is replaced, with _ph before the extension; leave the line out otherwise

# Card images cut from the owner's photos/scans of their own copy (2026-11-21).
# Placeholder art for a personal prototype: kept local (assets/cards/ is git-ignored),
# to be replaced by the owner's own artwork. One entry per folder (115 files).
- path: assets/cards/setup/          # 12 setup cards, named by content id (2p-1 … 4p-4)
  origin: you
  tool: "cut from the owner's sheet with a script (scratchpad cut_cards.py)"
  date: 2026-11-21
  ships: false
  placeholder: true
- path: assets/cards/leaders/        # leader-01 … leader-16
  origin: you
  date: 2026-11-21
  ships: false
  placeholder: true
- path: assets/cards/court/          # court-01 … court-31
  origin: you
  date: 2026-11-21
  ships: false
  placeholder: true
- path: assets/cards/court-campaign/ # court-cc-01 … court-cc-15
  origin: you
  date: 2026-11-21
  ships: false
  placeholder: true
- path: assets/cards/lore/           # lore-01 … lore-28
  origin: you
  date: 2026-11-21
  ships: false
  placeholder: true
- path: assets/cards/campaign/       # edicts, event, council, titles, flagship upgrades and boards
  origin: you
  date: 2026-11-21
  ships: false
  placeholder: true
