# Runs the type check and the unit tests on every push and pull request
# (docs/collaboration.md). data/content.json is committed, so the content
# checks run here too. The browser tests (npm run test:e2e) run in deploy.yml's
# e2e job, on every pull request and push to main, before anything is deployed.
name: tests

on:
  push:
  pull_request:

# Steps are bash scripts: on the self-hosted Windows runner, Git Bash (docs/ci-runner.md).
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run test:unit
