# Runs the type check and the unit tests on every push and pull request
# (docs/collaboration.md). Owner content is not in the repo: the tests use
# data/content.example.json and skip the content checks. The browser tests
# (npm run test:e2e) run locally.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run test:unit
