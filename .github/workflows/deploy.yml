# Publishes the site on Firebase Hosting (docs/online-access.md, "Automatic deploy"):
# - every push to main: the live site, https://farts-9435d.web.app
# - every pull request from this repository that changes the site: a preview
#   site; its link is posted as a comment on the pull request. It is deleted
#   when the pull request is merged or closed, and expires after 2 days anyway.
#   A pull request that changes only .claude/, .github/, docs/, design/, tools/,
#   production/, tests/ or Markdown files gets no preview.
# - run by hand (Actions > deploy > Run workflow): deletes every preview channel
#   (the live site stays), to free Firebase's channel quota.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_FARTS_9435D, created once
# by the Firebase project owner (`npx firebase init hosting:github`). Without it
# the jobs skip the deploy and say so. Firestore rules are not deployed here:
# after changing firestore.rules, run `npm run deploy:online` by hand.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write

# One queue per kind of run: a newer push to main replaces an older one, a newer commit on a pull request
# replaces its older preview; the hand-run cleanup and a closed pull request never cancel the live deploy.
concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # The browser tests (tests/integration: the table, the card powers, the known problems and the
  # seeded mouse-only games of tests/integration/playthrough.spec.ts). Nothing is deployed unless
  # they pass (production/piano-blindatura-tavolo-2026-11-25.md, decision C). Chrome is on the runner.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    timeout-minutes: 30
    # Runners side by side: the other browser tests on one, each seeded game (a few minutes with the
    # 3D map drawn in software) on its own. The names are those of tests/integration/playthrough/seeds.json.
    strategy:
      fail-fast: false
      matrix:
        part: [table, 2p-base-1366-it, 3p-leaders-1366-it, 4p-leaders-1366-it, 4p-base-1920-en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:single
      - name: Browser tests
        if: matrix.part == 'table'
        run: npx playwright test --workers=1 --reporter=line --grep-invert "a seeded game"
        env:
          CI: 'true'
      - name: Seeded game
        if: matrix.part != 'table'
        run: npx playwright test tests/integration/playthrough.spec.ts --workers=1 --reporter=line --grep "${{ matrix.part }}: a seeded game"
        env:
          CI: 'true'
      - name: Keep the failures' screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.part }}
          path: test-results/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: e2e
    # Pull requests from forks get no secrets: no preview for them. A closed pull request is the previews job's.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARTS_9435D != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run test:unit
      - name: Missing deploy key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT_FARTS_9435D is not set; nothing deployed (docs/online-access.md)."
      - name: Does this pull request change the site?
        id: site
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          site=$(git diff --name-only "$BASE" HEAD | grep -vE '^(\.claude/|\.github/|docs/|design/|production/|tests/|studio-tests/|tools/)|\.md$' || true)
          if [ -n "$site" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; echo "::notice::Only files outside the site changed: no preview."; fi
      # firebase.json's predeploy runs npm run build:online.
      - name: Deploy (live site)
        if: env.HAS_KEY == 'true' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARTS_9435D }}
          projectId: farts-9435d
          channelId: live
      - name: Deploy (preview for this pull request)
        if: env.HAS_KEY == 'true' && github.event_name == 'pull_request' && steps.site.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARTS_9435D }}
          projectId: farts-9435d
          expires: 2d

  previews:
    runs-on: ubuntu-latest
    # A merged or closed pull request: its preview channel goes. Run by hand: every preview channel goes.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARTS_9435D != '' }}
    steps:
      - name: Missing deploy key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT_FARTS_9435D is not set; no preview channel deleted."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: env.HAS_KEY == 'true'
      - name: Delete preview channels
        if: env.HAS_KEY == 'true'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARTS_9435D }}
          # Empty when run by hand: every channel but the live one.
          PR: ${{ github.event.pull_request.number }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          printf '%s' "$KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase hosting:channel:list --project farts-9435d --json > "$RUNNER_TEMP/channels.json"
          ids=$(node tools/ci/preview-channels.mjs "$RUNNER_TEMP/channels.json" "$PR")
          for id in $ids; do
            echo "Deleting preview channel $id"
            npx firebase hosting:channel:delete "$id" --project farts-9435d --force
          done
          [ -n "$ids" ] || echo "No preview channel to delete."
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
