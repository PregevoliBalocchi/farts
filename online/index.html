<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Accesso</title>
<!-- Styles: src/web/lobby.css (imported by src/web/lobby.ts), the table's dark gold look. -->
<style>body { margin: 0; background: #070504; color: #efe6d2; }</style>
</head>
<body class="lobby-page lobby">
<main>
  <header class="lb-title">
    <h1>Accesso al gioco</h1>
    <div class="row" id="signed-in" hidden>
      <span id="who"></span>
      <button id="sign-out" class="btn small" type="button">Esci</button>
    </div>
  </header>
  <p id="status" class="muted" role="status">Caricamento…</p>

  <section id="signed-out" class="frame" hidden>
    <p>Si entra solo su invito, con un account Google.</p>
    <button id="sign-in" class="btn primary" type="button">Accedi con Google</button>
  </section>

  <section id="lobby" hidden>
    <div class="frame" style="margin-bottom:22px">
      <h2>Le tue partite</h2>
      <ul id="games" class="games"></ul>
      <p id="games-msg" class="muted" role="status"></p>
    </div>
    <div class="frame">
      <h2>Nuova partita</h2>
      <div id="new-game"></div>
    </div>
  </section>

  <section id="content-admin" class="frame" hidden>
    <h2>Contenuti del gioco</h2>
    <p class="muted">Carica il file <code>data/content.json</code>: resta nel database, leggibile solo dagli invitati.</p>
    <input id="content-file" type="file" accept="application/json,.json">
    <p id="content-msg" class="muted" role="status"></p>
  </section>

  <section id="admin" class="frame" hidden>
    <h2>Amministrazione</h2>
    <form id="invite" class="inline">
      <input id="invite-email" type="email" placeholder="indirizzo Google da invitare" required autocomplete="off">
      <select id="invite-role" aria-label="Ruolo">
        <option value="player">giocatore</option>
        <option value="admin">amministratore</option>
      </select>
      <button class="btn primary" type="submit">Invita</button>
    </form>
    <p id="admin-msg" class="muted" role="status"></p>
    <table>
      <thead><tr><th>Indirizzo</th><th>Ruolo</th><th></th></tr></thead>
      <tbody id="members"></tbody>
    </table>
  </section>
</main>
<script type="module" src="../src/web/online.ts"></script>
</body>
</html>
