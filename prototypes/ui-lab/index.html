<meta charset="utf-8">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a 1600×900 game table scaled to the window; the map fills it, every panel is a movable widget over it. */
:root {
  --bg: #0b0e16; --panel: #141926; --panel-2: #1b2131; --line: #2a3147; --fg: #e8eaf2; --muted: #9aa1b6; --faint: #646b82;
  --gold: #f2b544; --gold-ink: #1a1406; --gold-soft: #2a2210;
  --p0: #4a8cff; --p1: #ff6f61; --p2: #46c27c; --p3: #f0c050;
  --imperial: #b07ce0; --blight: #3d9a6a; --free: #d7dae5;
  --r-material: #a07a45; --r-fuel: #d98a2b; --r-weapons: #c24b44; --r-relic: #2f9a8e; --r-psionic: #8f62d6;
  --s-construction: #e0742c; --s-administration: #9aa0ad; --s-aggression: #d33a35; --s-mobilization: #2f97b8;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#viewport { position: fixed; inset: 0 0 52px 0; display: flex; align-items: center; justify-content: center; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#stage { position: relative; width: 1600px; height: 900px; transform-origin: center center; background: radial-gradient(ellipse at 50% 50%, #18203a 0%, #0d111c 62%, #090b12 100%); border-radius: 6px; overflow: hidden; flex: none; }

/* map */
#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
.wedge { stroke: rgba(255,255,255,.08); stroke-width: 1; }
.link { stroke: rgba(210,215,235,.22); stroke-width: 2; }
.link.path { stroke: var(--gold); stroke-dasharray: 8 6; stroke-width: 2.5; opacity: .7; }
.sys { cursor: pointer; }
.sys:hover .body { stroke: var(--gold); stroke-width: 3; }
.gate-body { fill: #0e121d; stroke: rgba(230,232,245,.65); stroke-width: 2; }
.planet-body { stroke: rgba(255,255,255,.35); stroke-width: 1.5; }
.ctrl { fill: none; stroke-width: 4; }
.lbl { font: 600 11px var(--font-body); fill: rgba(232,234,242,.75); text-anchor: middle; pointer-events: none; }
.cnt { font: 700 12px var(--font-display); fill: #0b0e16; text-anchor: middle; pointer-events: none; }
.cnt-light { fill: #fff; }

/* widgets */
.w { position: absolute; background: rgba(20,25,38,.94); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 6px 22px rgba(0,0,0,.35); }
.w.bare { background: transparent; border-color: transparent; box-shadow: none; }
.w-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px 10px; }
.w-head { display: none; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; background: var(--gold); color: var(--gold-ink); font: 700 12px var(--font-display); cursor: move; user-select: none; }
.w-head span { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-head button { border: 0; background: rgba(0,0,0,.15); border-radius: 4px; width: 24px; height: 22px; font-size: 13px; }
.w-resize { display: none; position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, var(--gold) 50%); }
.editing .w { outline: 2px dashed rgba(242,181,68,.7); }
.editing .w-head { display: flex; }
.editing .w-resize { display: block; }
.editing .w-body { pointer-events: none; }
.editing #map { pointer-events: none; opacity: .55; }

.click { cursor: pointer; border-radius: 6px; }
.click:hover { background: rgba(242,181,68,.1); }
.h { font: 700 13px var(--font-display); letter-spacing: .02em; margin: 0 0 6px; color: var(--fg); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.num { font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; background: var(--panel-2); font-size: 11px; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.res { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 10px var(--font-body); color: #fff; flex: none; }
.slot { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed #3a4157; display: inline-flex; align-items: center; justify-content: center; position: relative; flex: none; }
.slot .k { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font: 700 9px var(--font-body); color: var(--gold); background: var(--bg); padding: 0 3px; border-radius: 3px; }
.slot.covered { border-style: solid; border-color: #2a3046; background: repeating-linear-gradient(45deg, #1a1f2d 0 4px, #222838 4px 8px); }
.mini { width: 34px; height: 46px; border-radius: 4px; object-fit: cover; border: 1px solid var(--line); }
.stat { display: inline-flex; gap: 3px; align-items: baseline; font-size: 12px; }
.stat b { font: 700 14px var(--font-display); }

.acard { width: 62px; height: 88px; border-radius: 7px; background: #f6f4ee; color: #222; position: relative; display: flex; flex-direction: column; padding: 4px 5px; border: 2px solid transparent; flex: none; }
.acard .n { font: 700 22px/1 var(--font-display); }
.acard .p { font-size: 9px; letter-spacing: 1px; }
.acard .s { position: absolute; left: 4px; bottom: 16px; font: 700 7px var(--font-body); letter-spacing: .05em; writing-mode: vertical-rl; transform: rotate(180deg); }
.acard .a { position: absolute; right: 4px; bottom: 3px; font: 700 8px var(--font-body); color: #555; }
.acard.sel { border-color: var(--gold); transform: translateY(-8px); box-shadow: 0 8px 16px rgba(0,0,0,.4); }
.acard.dim { opacity: .45; }
.acard.event { background: #fff; color: #111; }
.acard:hover { transform: translateY(-4px); }

.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 6px 10px; font-weight: 600; font-size: 12px; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn:hover { border-color: var(--gold); }

/* modal */
#modal { position: absolute; inset: 0; background: rgba(5,7,12,.72); display: flex; align-items: center; justify-content: center; z-index: 50; }
#modal .box { width: min(1040px, 92%); max-height: 86%; overflow: auto; background: #151a27; border: 1px solid #4a4330; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
#modal .bh { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
#modal .bh h2 { margin: 0; font: 700 20px var(--font-display); letter-spacing: .04em; flex: 1 1 auto; text-wrap: balance; }
#modal .bb { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; font-size: 13px; line-height: 1.5; }
.grid { display: grid; gap: 12px; }

/* lab bar */
#lab { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom, 0px)); z-index: 100; display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 12px; background: rgba(12,14,22,.92); border: 1px solid #3a3424; box-shadow: 0 8px 26px rgba(0,0,0,.5); font-size: 12px; flex-wrap: nowrap; max-width: calc(100% - 32px); overflow-x: auto; }
#lab .btn { padding: 5px 9px; }
#lab .btn[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
#lab select, #lab input { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: 12px var(--font-body); }
#lab .msg { color: var(--muted); min-width: 0; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hiddenList { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 101; background: #151a27; border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 260px; }
@media (prefers-reduced-motion: no-preference) { .acard { transition: transform .12s; } }
</style>

<div id="viewport"><div id="stage">
  <svg id="map" viewBox="0 0 1600 900" role="group" aria-label="Mappa: clicca un sistema per i dettagli, trascina per spostarla, rotella per lo zoom"></svg>
  <div id="widgets"></div>
  <div id="modal" hidden></div>
</div></div>

<div id="lab" role="toolbar" aria-label="Laboratorio interfaccia">
  <b style="font-family: var(--font-display); color: var(--gold);">Laboratorio</b>
  <button type="button" class="btn" id="btnEdit" aria-pressed="false">Modifica layout</button>
  <button type="button" class="btn" id="btnHidden">Elementi nascosti (0)</button>
  <input id="layoutName" type="text" value="mio layout" size="10" aria-label="Nome del layout">
  <button type="button" class="btn primary" id="btnSave">Salva</button>
  <select id="layoutPick" aria-label="Layout salvati"><option value="">Layout salvati…</option></select>
  <button type="button" class="btn" id="btnReset">Ripristina</button>
  <button type="button" class="btn" id="btnExport">Copia JSON</button>
  <span class="msg" id="labMsg" aria-live="polite"></span>
</div>
<div id="hiddenList" hidden></div>

<script>
// ---------------- sample game state (campaign, Act I, chapter 2) ----------------

  ambitions: [

// ---------------- map data (structure only) ----------------
const CLUSTERS = 6;
const PLANET_RES = { 1: ['weapons', 'fuel', 'material'], 2: ['psionic', 'weapons', 'relic'], 3: ['material', 'fuel', 'weapons'], 4: ['relic', 'fuel', 'material'], 5: ['weapons', 'relic', 'psionic'], 6: ['material', 'fuel', 'psionic'] };

const ID_SYM = ['▲', '☾', '⬢'];
// pieces per system: ships [player, fresh, damaged], imperial, blight ('B' fresh/'b' damaged), buildings [owner|'free', 'city'|'port', damaged]
const PIECES = {
  'c1-gate': { imperial: 1, ships: [[0, 2, 0]] }, 'c1-p1': { ships: [[0, 3, 0]], bld: [[0, 'city', 0]] }, 'c1-p2': { imperial: 1, ships: [[0, 1, 0]], bld: [[0, 'port', 0]] }, 'c1-p3': { blight: 'b' },
  'c2-gate': { imperial: 2, ships: [[1, 2, 0]] }, 'c2-p1': { imperial: 1, ships: [[1, 3, 0]], bld: [[1, 'city', 0], ['free', 'city', 0]] }, 'c2-p2': { blight: 'B' }, 'c2-p3': { imperial: 1, bld: [[1, 'port', 0]] },
  'c3-gate': { ships: [[2, 4, 1]] }, 'c3-p1': { ships: [[2, 2, 0]], bld: [[2, 'city', 0]] }, 'c3-p2': { blight: 'b', bld: [['free', 'city', 0]] }, 'c3-p3': { ships: [[2, 1, 0]], bld: [[2, 'port', 0]] },
  'c4-gate': { blight: 'b' }, 'c4-p1': { ships: [[3, 2, 0], [0, 1, 0]], bld: [[3, 'city', 0]] }, 'c4-p2': { flagship: 3, ships: [[3, 3, 0]] }, 'c4-p3': { blight: 'B' },
  'c5-gate': { ships: [[3, 2, 0]] }, 'c5-p1': { blight: 'b', bld: [['free', 'port', 0]] }, 'c5-p2': { ships: [[1, 1, 1]] }, 'c5-p3': { blight: 'b' },
  'c6-gate': { blight: 'b' }, 'c6-p1': { ships: [[0, 2, 0]] }, 'c6-p2': { blight: 'b', bld: [['free', 'city', 0]] }, 'c6-p3': { ships: [[2, 1, 0]] },
};
const CONTROL = { 'c1-gate': 'imperial', 'c1-p2': 'imperial', 'c2-gate': 'imperial', 'c2-p1': 'imperial', 'c2-p3': 'imperial', 'c3-gate': 2, 'c3-p1': 2, 'c3-p3': 2, 'c4-p1': 3, 'c4-p2': 3, 'c5-gate': 3, 'c1-p1': 0, 'c6-p1': 0, 'c6-p3': 2 };

// ---------------- helpers ----------------
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const resDot = (r, size = 22) => `<span class="res" title="${RES[r][0]}" style="background:${RES[r][1]};width:${size}px;height:${size}px">${RES[r][2]}</span>`;
const pColor = (i) => PC[i];
const pName = (i) => G.players[i].name;
const img = (id) => `img/${id}.png`;

// ---------------- map drawing ----------------
const NS = 'http://www.w3.org/2000/svg';
const CX = 800, CY = 450;
const sysPos = {};
function polar(r, deg) { const a = (deg * Math.PI) / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; }
function el(tag, attrs, parent, text) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
function drawMap() {
  const svg = $('#map'); svg.textContent = '';
  const g = el('g', { id: 'mapRoot' }, svg);
  for (let c = 1; c <= CLUSTERS; c++) {
    const base = -90 + (c - 1) * 60;
    const [x1, y1] = polar(1200, base - 30), [x2, y2] = polar(1200, base + 30), [i1x, i1y] = polar(120, base - 30), [i2x, i2y] = polar(120, base + 30);
    el('path', { d: `M${i1x} ${i1y} L${x1} ${y1} L${x2} ${y2} L${i2x} ${i2y} Z`, class: 'wedge', fill: c % 2 ? 'rgba(80,60,120,.10)' : 'rgba(40,70,120,.10)' }, g);
    sysPos[`c${c}-gate`] = polar(175, base);
    [-17, 0, 17].forEach((d, k) => { sysPos[`c${c}-p${k + 1}`] = polar(c % 2 ? 340 : 350, base + d); });
  }
  el('circle', { cx: CX, cy: CY, r: 118, fill: '#0b0e18', stroke: 'rgba(255,255,255,.12)' }, g);
  el('text', { x: CX, y: CY + 6, class: 'lbl', style: 'font: 700 20px var(--font-display); fill: rgba(232,234,242,.25)' }, g, 'RIFLETTI');
  const links = el('g', {}, g);
  const line = (a, b, cls = 'link') => { const [x1, y1] = sysPos[a], [x2, y2] = sysPos[b]; el('line', { x1, y1, x2, y2, class: cls }, links); };
  for (let c = 1; c <= CLUSTERS; c++) {
    for (let k = 1; k <= 3; k++) line(`c${c}-gate`, `c${c}-p${k}`);
    line(`c${c}-p1`, `c${c}-p2`); line(`c${c}-p2`, `c${c}-p3`);
    line(`c${c}-gate`, `c${c % 6 + 1}-gate`);
  }
  line('c2-p3', 'c3-p1'); line('c5-p3', 'c6-p1');
  for (const id of Object.keys(sysPos)) drawSystem(g, id);
  applyView();
}
function drawSystem(g, id) {
  const [x, y] = sysPos[id]; const gate = id.endsWith('gate'); const c = +id[1]; const k = gate ? 0 : +id.slice(-1);
  const s = el('g', { class: 'sys', tabindex: 0, role: 'button', 'aria-label': `Sistema ${id}` }, g);
  const ctrl = CONTROL[id];
  if (ctrl !== undefined) el('circle', { cx: x, cy: y, r: gate ? 33 : 50, class: 'ctrl', stroke: ctrl === 'imperial' ? 'var(--imperial)' : pColor(ctrl), opacity: .9 }, s);
  if (gate) {
    el('circle', { cx: x, cy: y, r: 27, class: 'body gate-body' }, s);
    el('text', { x, y: y + 5, class: 'lbl', style: 'font: 700 15px var(--font-display)' }, s, String(c));
  } else {
    const r = PLANET_RES[c][k - 1];
    el('circle', { cx: x, cy: y, r: 44, class: 'body planet-body', fill: RES[r][1], 'fill-opacity': .35 }, s);
    el('text', { x, y: y - 30, class: 'lbl' }, s, `${ID_SYM[k - 1]} ${RES[r][0]} · ${SLOTS[c][k - 1]}`);
  }
  const P = PIECES[id] || {};
  let items = [];
  (P.bld || []).forEach((b) => items.push({ t: 'bld', b }));
  if (P.imperial) items.push({ t: 'imp', n: P.imperial });
  if (P.flagship !== undefined) items.push({ t: 'flag', p: P.flagship });
  (P.ships || []).forEach((sh) => items.push({ t: 'ship', sh }));
  if (P.blight) items.push({ t: 'blight', v: P.blight });
  const per = 3, sp = 22;
  items.forEach((it, i) => {
    const row = Math.floor(i / per), col = i % per, n = Math.min(per, items.length - row * per);
    const ix = x + (col - (n - 1) / 2) * sp, iy = y + (gate ? -2 : 2) + row * 22 - (items.length > per ? 10 : 0);
    if (it.t === 'bld') {
      const [o, type, dmg] = it.b; const fill = o === 'free' ? 'var(--free)' : pColor(o);
      el('path', { d: `M${ix} ${iy - 10} L${ix + 10} ${iy + 8} L${ix - 10} ${iy + 8} Z`, fill, stroke: '#0b0e16', 'stroke-width': 1.5, opacity: dmg ? .5 : 1 }, s);
      el('text', { x: ix, y: iy + 6, class: 'cnt', style: 'font-size:9px' }, s, type === 'city' ? 'C' : 'S');
    } else if (it.t === 'imp') {
      el('rect', { x: ix - 10, y: iy - 9, width: 20, height: 18, rx: 4, fill: 'var(--imperial)', stroke: '#0b0e16' }, s);
      el('text', { x: ix, y: iy + 4, class: 'cnt' }, s, String(it.n));
    } else if (it.t === 'flag') {
      el('path', { d: `M${ix} ${iy - 12} L${ix + 9} ${iy + 9} L${ix - 9} ${iy + 9} Z`, fill: pColor(it.p), stroke: '#fff', 'stroke-width': 1.5 }, s);
      el('text', { x: ix, y: iy + 6, class: 'cnt cnt-light', style: 'font-size:8px' }, s, 'F');
    } else if (it.t === 'ship') {
      const [p, f, d] = it.sh;
      el('circle', { cx: ix, cy: iy, r: 10, fill: pColor(p), stroke: '#0b0e16', 'stroke-width': 1.5 }, s);
      el('text', { x: ix, y: iy + 4, class: 'cnt' }, s, String(f + d));
      if (d) el('circle', { cx: ix + 8, cy: iy - 8, r: 5, fill: '#0b0e16', stroke: pColor(p) }, s);
    } else {
      const fresh = it.v === 'B';
      el('circle', { cx: ix, cy: iy, r: 10, fill: 'var(--blight)', stroke: fresh ? '#d9f5e4' : '#0b0e16', 'stroke-width': fresh ? 2 : 1.5, opacity: fresh ? 1 : .7 }, s);
      el('text', { x: ix, y: iy + 4, class: 'cnt cnt-light' }, s, fresh ? '3' : '1');
    }
  });
  s.addEventListener('click', (e) => { if (!editing && !moved) openSystem(id); });
  s.addEventListener('keydown', (e) => { if (e.key === 'Enter') openSystem(id); });
}

// pan & zoom
let view = { x: 0, y: 0, w: 1600, h: 900 }, moved = false;
function applyView() { $('#map').setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`); }
(function panZoom() {
  const svg = $('#map'); let start = null;
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(); const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    const k = e.deltaY > 0 ? 1.12 : 1 / 1.12; const nw = Math.min(1600, Math.max(420, view.w * k)), nh = nw * 900 / 1600;
    view.x += (view.w - nw) * fx; view.y += (view.h - nh) * fy; view.w = nw; view.h = nh; applyView();
  }, { passive: false });
  svg.addEventListener('pointerdown', (e) => { start = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; });
  addEventListener('pointermove', (e) => {
    if (!start) return; const r = svg.getBoundingClientRect(); const dx = (e.clientX - start.x) * view.w / r.width, dy = (e.clientY - start.y) * view.h / r.height;
    if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; svg.classList.add('dragging'); }
    view.x = start.vx - dx; view.y = start.vy - dy; applyView();
  });
  addEventListener('pointerup', () => { start = null; svg.classList.remove('dragging'); setTimeout(() => (moved = false), 0); });
})();

  return `<div class="grid" style="grid-template-columns:260px minmax(0,1fr);align-items:start">
    <img src="${img(id)}" alt="${id}" style="width:260px;border-radius:12px">
    <div style="display:flex;flex-direction:column;gap:10px"><div class="h" style="font-size:16px">${id}</div>${extra}
    <div style="padding:10px;border-radius:8px;background:var(--panel-2)"><b>Effetto</b><div class="muted">Riassunto dell'effetto e FAQ della carta (dal file degli effetti).</div></div></div></div>`;
}
function open(key) {
  const [k, arg] = key.split(':');
  const i = Number(arg);
  if (k === 'player') return openModal(`${pName(i)}`, playerDetail(i));
  if (k === 'board' || k === 'captives' || k === 'trophies' || k === 'favors' || k === 'outrage') return openModal('La tua plancia', playerDetail(0));
  if (k === 'card') return openModal(arg, cardDetail(arg));
  if (k === 'court') {
    const c = G.court[i];
    const ag = c.agents.map((n, p) => `<span class="pill" style="background:${pColor(p)};color:#0b0e16">${pName(p)} ♟${n}</span>`).join(' ');
    const can = c.agents[0] > Math.max(...c.agents.slice(1)) ? '<div style="padding:10px;border-radius:8px;background:var(--gold-soft)">Hai la maggioranza degli agenti: puoi prenderla con <b>Secure</b>.</div>' : '';
    const att = c.attached ? `<div><div class="h">Carta attaccata</div><img src="${img(c.attached)}" alt="${c.attached}" style="width:150px;border-radius:8px"></div>` : '';
    return openModal(c.label, cardDetail(c.id, `<div class="muted">${esc(c.kind)}</div><div class="row">${ag}</div>${can}${att}<div class="row"><button type="button" class="btn">Influenza</button><button type="button" class="btn primary">Secure</button></div>`));
  }
  if (k === 'amb') {
    const a = G.ambitions[i];
    const order = a.counts.map((v, p) => [v, p]).sort((x, y) => y[0] - x[0]);
    return openModal(`${a.name}`, `<div class="muted">Dichiarata con: ${a.markers.join(', ') || 'non dichiarata'}. Valori di ogni giocatore adesso:</div>
      <div style="display:flex;flex-direction:column;gap:6px">${order.map(([v, p], r) => `<div class="row" style="justify-content:space-between;padding:8px;border-radius:8px;background:var(--panel-2)"><span class="row"><span class="dot" style="background:${pColor(p)}"></span><b>${pName(p)}</b></span><span class="num">${v} ${r === 0 && v > (order[1] || [0])[0] ? '· 1° posto' : ''}</span></div>`).join('')}</div>
      <div class="faint">Con i segnalini attuali: 1° posto ${a.markers.length ? a.markers.map((m) => m.split('/')[0]).reduce((x, y) => +x + +y, 0) : 0} Potere, 2° ${a.markers.length ? a.markers.map((m) => m.split('/')[1]).reduce((x, y) => +x + +y, 0) : 0}. Parità al 1° = tutti 2°.</div>`);
  }
  if (k === 'trust') return openModal('First Regent e Imperial Trust', `<div class="grid" style="grid-template-columns:220px minmax(0,1fr)"><img src="img/title-regent.png" alt="Titolo Regent" style="width:220px;border-radius:10px"><div style="display:flex;flex-direction:column;gap:8px"><b>${esc(pName(G.players.findIndex((p) => p.first)))} è First Regent</b><div class="row">${G.trust.map((r) => resDot(r, 30)).join('')}</div><span class="muted">Le risorse del Trust sono congelate: non si spendono né si cedono, ma contano per le ambizioni di chi ha la tessera. Un Outlaw può rubarle prendendo l'Imperial Council.</span></div></div>`);
  if (k === 'booklet') return openModal('Libretto delle regole', G.booklet.map((b) => `<div class="grid" style="grid-template-columns:200px minmax(0,1fr)"><img src="img/${b.id}.png" alt="${b.id}" style="width:200px;border-radius:10px"><div><b>${esc(b.label)}</b><div class="muted">${esc(b.text)}</div></div></div>`).join('') + '<div class="faint">Qui compaiono editti, leggi e carte Summit aggiunte dai Fate.</div>');
  if (k === 'fate') return openModal('Il tuo Fate', playerDetail(0));
  if (k === 'supply') return openModal('Riserva generale', `<div class="row" style="gap:18px">${Object.entries(G.supply).map(([r, n]) => `<span class="row" style="gap:6px">${resDot(r, 34)}<b style="font-size:18px">${n}</b> ${RES[r][0]}</span>`).join('')}</div><div class="muted">Risorse ancora disponibili su 5 per tipo. Senza gettoni di un tipo, tassare non dà nulla.</div>`);
  if (k === 'chapter') return openModal(`Atto ${G.act} · Capitolo ${G.chapter}`, `<div class="muted">Atti I e II durano 3 capitoli, l'atto III ne dura 4. Alla fine degli atti I e II c'è l'Intermission.</div>`);
  if (k === 'round') return openModal(`Round ${G.round}`, `<div style="display:flex;flex-direction:column;gap:6px">${G.roundPlays.map((r) => `<span class="row"><span class="dot" style="background:${pColor(r.p)}"></span><b>${pName(r.p)}</b> ${esc(r.what)}</span>`).join('')}</div><div class="muted">Carta di testa: ${SUIT[G.lead.suit][0]} ${G.lead.n} (vale 0: dichiarato ${G.lead.declared}). Initiative prevista a fine round: Tu.</div>`);
  if (k === 'log') return openModal('Registro', `<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">${G.log.map((l) => `<li>${esc(l)}</li>`).join('')}</ol>`);
  if (k === 'settings') return openModal('Impostazioni', '<div class="muted">Audio, lingua, animazioni, colori dei giocatori.</div>');
  if (k === 'action') return openModal(G.played.actions[i], '<div class="muted">Qui parte l\'azione a passi: la mappa evidenzia le scelte valide (sistemi, slot liberi, città tassabili) e la banda in alto spiega il passo.</div>');
  if (k === 'prelude') return openModal('Prelude: spendi una risorsa', `<div class="row" style="gap:10px">${G.players[0].slots.filter((s) => s && s !== 'c').map((r) => `<button type="button" class="btn" style="display:flex;gap:8px;align-items:center">${resDot(r, 24)} ${RES[r][0]}</button>`).join('')}</div><div class="muted">Le risorse con Outrage non si possono spendere nel prelude.</div>`);
  if (k === 'hand') { const c = G.hand[i]; return openModal(c.event ? 'Evento' : `${SUIT[c.suit][0]} ${c.n}`, `<div class="row" style="gap:20px;align-items:flex-start">${acard(c)}<div class="muted">${c.event ? 'Dà le stesse azioni della carta di testa, se nessun rivale ha già giocato un Evento o preso il Council in questo round.' : `Supera: ${c.pips} azioni. Pivot: 1 azione (${SUIT[c.suit][2]}). Copia: 1 azione del seme di testa.`}</div></div><div class="row"><button type="button" class="btn primary">Supera</button><button type="button" class="btn">Pivot</button><button type="button" class="btn">Copia</button><button type="button" class="btn">Seize con questa</button></div>`); }
  if (k === 'undo' || k === 'confirm') return openModal(k === 'undo' ? 'Annulla' : 'Conferma il turno', `<div class="muted">${k === 'undo' ? 'Annulla l\'ultima azione del turno, finché non confermi.' : 'Invia il turno al server: da quel momento le mosse sono definitive e gli altri le vedono.'}</div>`);
}
function openSystem(id) {
  const P = PIECES[id] || {}; const gate = id.endsWith('gate'); const c = +id[1], k = +id.slice(-1);
  const ctrl = CONTROL[id];
  const rows = [];
  (P.ships || []).forEach(([p, f, d]) => rows.push(`<span class="row"><span class="dot" style="background:${pColor(p)}"></span>${pName(p)}: ${f} navi integre${d ? `, ${d} danneggiate` : ''}</span>`));
  if (P.imperial) rows.push(`<span class="row"><span class="dot" style="background:var(--imperial)"></span>${P.imperial} navi Imperiali</span>`);
  if (P.flagship !== undefined) rows.push(`<span class="row"><span class="dot" style="background:${pColor(P.flagship)}"></span>Flagship di ${pName(P.flagship)}</span>`);
  (P.bld || []).forEach(([o, t, d]) => rows.push(`<span>${t === 'city' ? 'Città' : 'Porto stellare'} ${o === 'free' ? 'Free' : 'di ' + pName(o)}${d ? ' (danneggiato)' : ''}</span>`));
  if (P.blight) rows.push(`<span class="row"><span class="dot" style="background:var(--blight)"></span>Blight ${P.blight === 'B' ? 'integro (3 colpi nelle Crisi)' : 'danneggiato (1 colpo)'}</span>`);
  const head = gate ? `Gate del cluster ${c}` : `Pianeta ${id} · ${RES[PLANET_RES[c][k - 1]][0]} · ${ID_SYM[k - 1]} · ${SLOTS[c][k - 1]} slot`;
  openModal(head, `<div style="display:flex;flex-direction:column;gap:6px">${rows.join('') || '<span class="muted">Vuoto</span>'}</div>
    <div class="muted">Controllo: <b>${ctrl === undefined ? 'nessuno' : ctrl === 'imperial' ? 'Impero (nel turno di un Regent con pezzi qui, quel Regent)' : pName(ctrl)}</b></div>
    <div class="row"><button type="button" class="btn">Muovi da qui</button><button type="button" class="btn">Battaglia qui</button><button type="button" class="btn">Costruisci qui</button></div>`);
}
function bindClicks() {
  document.querySelectorAll('#widgets [data-open]').forEach((b) => b.addEventListener('click', (e) => { if (editing) return; e.stopPropagation(); open(b.dataset.open); }));
}

// ---------------- layout editing ----------------
const SNAP = 5;
const snap = (v) => Math.round(v / SNAP) * SNAP;
function stageScale() { return $('#stage').getBoundingClientRect().width / 1600; }
let drag = null;
$('#widgets').addEventListener('pointerdown', (e) => {
  if (!editing) return;
  const w = e.target.closest('.w'); if (!w) return;
  const id = w.dataset.id;
  if (e.target.closest('[data-hide]')) { layout[id].hidden = true; w.hidden = true; updateHiddenCount(); note('Nascosto: ' + WIDGETS[id].title); return; }
  const mode = e.target.closest('.w-resize') ? 'resize' : e.target.closest('.w-head') ? 'move' : null;
  if (!mode) return;
  e.preventDefault();
  w.parentNode.appendChild(w);
  drag = { id, w, mode, sx: e.clientX, sy: e.clientY, L: { ...layout[id] }, k: stageScale() };
});
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = (e.clientX - drag.sx) / drag.k, dy = (e.clientY - drag.sy) / drag.k; const L = layout[drag.id];
  if (drag.mode === 'move') { L.x = Math.max(0, Math.min(1600 - L.w, snap(drag.L.x + dx))); L.y = Math.max(0, Math.min(900 - 24, snap(drag.L.y + dy))); }
  else { L.w = Math.max(80, Math.min(1600 - L.x, snap(drag.L.w + dx))); L.h = Math.max(40, Math.min(900 - L.y, snap(drag.L.h + dy))); }
  Object.assign(drag.w.style, { left: L.x + 'px', top: L.y + 'px', width: L.w + 'px', height: L.h + 'px' });
});
addEventListener('pointerup', () => { if (drag) { drag = null; persistLocal(); } });

function setEditing(on) {
  editing = on; $('#stage').classList.toggle('editing', on);
  $('#btnEdit').setAttribute('aria-pressed', String(on));
  $('#btnEdit').textContent = on ? 'Fine modifica' : 'Modifica layout';
  note(on ? 'Trascina la barra gialla per spostare, l\'angolo per ridimensionare, ✕ per nascondere.' : '');
  closeModal();
}
$('#btnEdit').onclick = () => setEditing(!editing);
function updateHiddenCount() {
  const hidden = Object.keys(WIDGETS).filter((id) => layout[id] && layout[id].hidden);
  $('#btnHidden').textContent = `Elementi nascosti (${hidden.length})`;
  const list = $('#hiddenList');
  list.innerHTML = hidden.length ? `<b>Rimetti sul tavolo</b>${hidden.map((id) => `<button type="button" class="btn" data-show="${id}">${esc(WIDGETS[id].title)}</button>`).join('')}` : '<span class="muted">Nessun elemento nascosto</span>';
  list.querySelectorAll('[data-show]').forEach((b) => (b.onclick = () => { layout[b.dataset.show].hidden = false; renderWidgets(); persistLocal(); }));
}
$('#btnHidden').onclick = () => { $('#hiddenList').hidden = !$('#hiddenList').hidden; };
$('#btnReset').onclick = () => { layout = defaultLayout(); renderWidgets(); persistLocal(); note('Layout iniziale ripristinato'); };
$('#btnExport').onclick = () => {
  const text = JSON.stringify({ name: $('#layoutName').value, stage: [1600, 900], widgets: layout }, null, 1);
  try { navigator.clipboard.writeText(text).then(() => note('JSON copiato'), () => showJson(text)); } catch (e) { showJson(text); }
};
function showJson(text) { openModal('Layout in JSON', `<textarea id="jsonOut" rows="16" style="width:100%;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;font:12px ui-monospace,Consolas,monospace">${esc(text)}</textarea>`); $('#jsonOut').select(); }
function note(t) { $('#labMsg').textContent = t; }
function persistLocal() { try { localStorage.setItem('tavolo-layout', JSON.stringify(layout)); } catch (e) {} }
function loadLocal() { try { const v = JSON.parse(localStorage.getItem('tavolo-layout') || 'null'); if (v) layout = { ...defaultLayout(), ...v }; } catch (e) {} }

// shared saves (artifact db): Claude reads them back to build the real UI
let db = null;
const slug = (s) => (s || 'layout').toLowerCase().replace(/[^a-z0-9_.~:@+-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'layout';
$('#btnSave').onclick = async () => {
  persistLocal();
  const name = $('#layoutName').value.trim() || 'mio layout';
  if (!db) { note('Salvato solo in questo browser'); return; }
  note('Salvataggio…');
  try { await db.doc('layouts/' + slug(name)).set({ name, stage: [1600, 900], widgets: JSON.parse(JSON.stringify(layout)), savedAt: new Date().toISOString() }); note('Salvato: ' + name); }
  catch (e) { note(e && e.code === 'invalid_argument' ? 'Non hai i permessi per salvare qui' : 'Salvataggio non riuscito, riprova'); }
};
$('#layoutPick').onchange = (e) => {
  const v = e.target.value; if (!v) return; const doc = savedLayouts[v]; if (!doc) return;
  layout = { ...defaultLayout(), ...doc.widgets }; $('#layoutName').value = doc.name; renderWidgets(); persistLocal(); note('Caricato: ' + doc.name);
};
let savedLayouts = {};
function fillPick() {
  const sel = $('#layoutPick'); const cur = sel.value;
  sel.innerHTML = '<option value="">Layout salvati…</option>' + Object.entries(savedLayouts).map(([id, d]) => `<option value="${esc(id)}">${esc(d.name)}</option>`).join('');
  sel.value = cur;
}

// ---------------- scale & boot ----------------
function fit() { const k = Math.min(innerWidth / 1600, (innerHeight - 56) / 900); $('#stage').style.transform = `scale(${k})`; }
addEventListener('resize', fit);
loadLocal(); drawMap(); renderWidgets(); fit();
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { note('I layout restano in questo browser'); return; }
  db.collection('layouts').onSnapshot((snap) => { savedLayouts = {}; snap.docs.forEach((d) => { const v = d.data(); if (v && v.widgets) savedLayouts[d.id] = v; }); fillPick(); }, () => note('Layout salvati non raggiungibili'));
})();
</script>
