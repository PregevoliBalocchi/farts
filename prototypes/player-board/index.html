/* Your Court: bottom right, real cards in a row that overlap only when they do not fit. */
.mycourt { position: absolute; right: calc(10 * var(--u)); bottom: calc(10 * var(--u)); width: calc(470 * var(--u)); padding: calc(6 * var(--u)) calc(10 * var(--u)) calc(10 * var(--u)); display: grid; gap: calc(4 * var(--u)); }
.mycourt h5 { margin: 0; display: flex; gap: calc(8 * var(--u)); align-items: baseline; font-size: calc(12 * var(--u)); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }

.fanrow { display: flex; align-items: flex-end; min-width: 0; }

.cc { position: relative; flex: none; width: calc(112 * var(--u)); height: calc(156 * var(--u)); border-radius: calc(8 * var(--u)); padding: calc(6 * var(--u)); display: grid; grid-template-rows: auto 1fr auto; background: linear-gradient(180deg, #f2e8d2, #ddd0b0); color: #1d150d; border: calc(3 * var(--u)) solid var(--kc); box-shadow: 0 calc(6 * var(--u)) calc(14 * var(--u)) #000b; transition: transform .15s; }
.cc b { font-size: calc(11 * var(--u)); text-transform: uppercase; line-height: 1.1; }
.cc .art { margin: calc(4 * var(--u)) 0; border-radius: 4px; background: linear-gradient(135deg, #5a4a33, #2a2116); display: grid; place-items: center; }

.cc.guild { --kc: #c99a3a; } .cc.vox { --kc: #8e5cc8; } .cc.lore { --kc: #4a8f7a; }

/* The Court row on top: draw pile, the cards you can take (agents under each), discard pile. */

}

<div id="table"><div class="map"></div></div>
<div id="stage"></div>

<script>
// PROTOTYPE - NOT FOR PRODUCTION
const A = '../../assets/ui/';
const RES = ['material', 'fuel', 'weapons', 'relic', 'psionic'];
const PRELUDE = { material: ['Materiale', 'Costruisci o ripara'], fuel: ['Carburante', 'Muovi'], weapons: ['Armi', 'Battaglia questo turno'], relic: ['Reliquia', 'Assicura'], psionic: ['Psionica', "Un'azione della carta guida"] };
const KEYS = [3, 1, 1, 2, 1, 3];
const tok = (r) => `<img class="tok" src="${A}token/resource-${r}.png" alt="${r}">`;
const ic = (r, cls = 'ic') => `<img class="${cls}" src="${A}icon/${r}.png" alt="${r}">`;
const piece = (k, s) => `<img src="${A}piece/${k}-${s}.png" alt="${k}">`;
const keyRibbon = (n) => `<span class="keys" title="${n} chiavi"><b>${n}</b><img src="${A}icon/key.png" alt="chiavi"></span>`;
const SUITS = { adm: ['Amministrazione', ['Tassa', 'Ripara', 'Influenza']], agg: ['Aggressione', ['Battaglia', 'Muovi', 'Assicura']], con: ['Costruzione', ['Costruisci', 'Ripara', 'Influenza']], mob: ['Mobilitazione', ['Muovi', 'Influenza']] };
const card = (su, n, pips, extra = '') => `<div class="card su-${su} ${extra}"><span class="n">${n}</span><span class="pips">${'✦'.repeat(pips)}</span><span class="suit">${SUITS[su][0]}</span><span class="kw">${SUITS[su][1].map((k) => `<span>${k}</span>`).join('')}</span></div>`;

/**
 * The physical board. slots: 6 entries, each a resource, null (empty open slot), 'city' (unbuilt city covers it).
 * bonus: [+2 built?, +3 built?] (a built city uncovers the bonus).
 */
/** Slots (0-based) still under an unbuilt city: built from the left, the third covers slots 5 and 6. */
function coveredSlots(built) {
  const c = new Set();
  if (built < 1) c.add(2);
  if (built < 2) c.add(3);
  if (built < 3) { c.add(4); c.add(5); }
  return c;
}

function board(o) {
  const s = o.seat;
  const covered = coveredSlots(o.built);
  const city = `<img class="city" src="${A}piece/city-${s}.png" alt="città">`;
  const slot = (i) => {
    if (covered.has(i)) return `<div class="slot">${keyRibbon(KEYS[i])}<div class="space tri">${city}</div></div>`;
    const v = (o.res || [])[i];
    const cls = ['space', (o.glow || []).includes(i) ? 'glow' : '', (o.dim || []).includes(i) ? 'dim' : '', (o.pick || []).includes(i) ? 'pick' : ''].join(' ');
    const x = (o.x || []).includes(i) ? '<span class="x">×</span>' : '';
    return `<div class="slot">${keyRibbon(KEYS[i])}<div class="${cls}">${v ? tok(v) : ''}${x}</div></div>`;
  };
  // The third city covers slots 5 and 6 together.
  const pair = covered.has(4)
    ? `<div class="slot wide"><span style="display:flex;gap:calc(26*var(--u))">${keyRibbon(KEYS[4])}${keyRibbon(KEYS[5])}</span><div class="space tri wide">${city}</div></div>`
    : slot(4) + slot(5);
  const bonus = (b, label) => `<div class="slot"><span class="keys" style="visibility:hidden"></span><div class="space tri">${b ? `<span class="bonus">${label}</span>` : city}</div></div>`;
  const prelude = RES.map((r) => {
    const out = (o.outraged || []).includes(r);
    const live = (o.live || []).includes(r) && !out;
    const words = o.mini ? '' : `<div><b>${PRELUDE[r][0]}</b><span>${out ? 'Oltraggio: non si spende' : PRELUDE[r][1]}</span></div>`;
    return `<div class="pa${out ? ' out' : ''}${live ? ' live' : ''}${o.mini ? ' mini' : ''}">${ic(r)}${out ? `<img class="agent" src="${A}piece/agent-${s}.png" alt="">` : ''}${words}</div>`;
  }).join('');
  const spoil = (title, list) => `<div class="box"><h5>${title}</h5><div class="pieces">${list.map(([k, seat, n]) => `${piece(k, seat)}<span class="n num">${n}</span>`).join('') || '<span class="n" style="color:var(--faint)">—</span>'}</div></div>`;
  return `<div class="frame pboard${o.active ? ' active' : ''}" style="${o.style || ''}">
    <div class="reserve">
      <div class="r">${piece('ship', s)}<span class="num">${o.ships}</span></div>
      <div class="r">${piece('agent', s)}<span class="num">${o.agents}</span></div>
      <div class="r">${piece('starport', s)}<span class="num">${o.ports}</span></div>
    </div>
    <div>
      <div class="slots">${[0, 1, 2, 3].map(slot).join('')}${pair}<span class="slot-gap"></span>${bonus(o.built >= 4, '+2')}${bonus(o.built >= 5, '+3')}</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:calc(8*var(--u));align-items:end">
        <div class="prelude" style="flex-wrap:wrap;max-width:calc(540*var(--u))">${prelude}</div>
        <div class="spoils">${spoil('Trofei', o.trophies)}${spoil('Prigionieri', o.captives)}</div>
      </div>
    </div>
    <div class="namebar" style="background:var(--s${s})">${o.initiative ? `<img class="initiative" src="${A}token/initiative.png" alt="iniziativa">` : ''}<span>${o.name}</span><span class="sp"></span><span style="font-weight:600;font-size:calc(12*var(--u))">mano ${o.hand}</span><span class="power num">${o.power}</span></div>
  </div>`;
}

/** A compact band: name and power, the six slots small, Outrage, counts, held Court cards, played card. */
function band(o) {
  const s = o.seat;
  const cov = coveredSlots(o.built);
  const ms = KEYS.map((k, i) => {
    if (i === 5 && cov.has(5)) return '';
    const wide = i === 4 && cov.has(4) ? ' wide' : '';
    const v = (o.res || [])[i];
    const keys = wide ? '⚷ · ⚷⚷⚷' : '⚷'.repeat(k);
    return `<span class="ms${cov.has(i) ? ' tri' : ''}${wide}"><span class="k">${keys}</span>${cov.has(i) ? `<img class="city" src="${A}piece/city-${s}.png" alt="">` : v ? `<img src="${A}token/resource-${v}.png" alt="">` : ''}</span>`;
  }).join('');
  const outs = (o.outraged || []).map((r) => `<span class="o">${ic(r)}<img class="ag" src="${A}piece/agent-${s}.png" alt=""></span>`).join('');
  const courts = (o.courts || []).map(([r]) => `<span class="court" style="width:calc(26*var(--u));height:calc(36*var(--u));padding-top:2px"><img src="${A}icon/${r}.png" style="width:calc(16*var(--u));height:calc(16*var(--u))" alt=""></span>`).join('');
  return `<div class="frame band${o.active ? ' active' : ''}" style="${o.style || ''}">
    <div class="who"><span class="namebar" style="background:var(--s${s})">${o.initiative ? `<img class="initiative" style="width:calc(20*var(--u))" src="${A}token/initiative.png" alt="">` : ''}${o.name}<span class="power num" style="width:calc(28*var(--u));height:calc(28*var(--u));font-size:calc(14*var(--u));margin:-6px 0 -6px 6px">${o.power}</span></span>
      <span class="counts"><span>${piece('ship', s)}<b class="num">${o.ships}</b></span><span>${piece('agent', s)}<b class="num">${o.agents}</b></span><span>${piece('starport', s)}<b class="num">${o.ports}</b></span></span></div>
    <div style="display:grid;gap:calc(8*var(--u));padding-top:calc(8*var(--u))"><div class="mslots">${ms}</div><div class="outs">${outs}</div></div>
    <div style="display:grid;gap:calc(4*var(--u))"><span class="counts"><span title="trofei">🏆<b class="num">${o.trophyN}</b></span><span title="prigionieri">⛓<b class="num">${o.captiveN}</b></span><span>✋<b class="num">${o.hand}</b></span></span><div style="display:flex;gap:3px">${courts}</div></div>
    <div>${o.played || ''}</div>
  </div>`;
}

const seats = {
  me: { seat: 0, name: 'Giocatore 1 (tu)', power: 6, ships: 11, agents: 7, cities: 3, ports: 4, hand: 5, active: true, initiative: true,
    res: ['fuel', 'material', 'weapons'], built: 1, outraged: ['relic'],
    trophies: [['ship', 1, 2], ['city', 2, 1]], captives: [['agent', 2, 1]] },
  r1: { seat: 1, name: 'Giocatore 2', power: 9, ships: 8, agents: 6, cities: 2, ports: 4, hand: 4,
    res: ['psionic', 'relic', 'relic', 'material'], built: 2, outraged: [],
    trophies: [['ship', 2, 3]], captives: [], trophyN: 3, captiveN: 0, courts: [['psionic'], ['relic']] },
  r2: { seat: 2, name: 'Giocatore 3', power: 4, ships: 13, agents: 9, cities: 4, ports: 5, hand: 5,
    res: ['weapons', 'weapons'], built: 0, outraged: ['fuel'],
    trophies: [], captives: [['agent', 0, 2]], trophyN: 0, captiveN: 2, courts: [['weapons']] },
};

const handCards = [['adm', 4, 3], ['agg', 6, 2], ['con', 2, 4], ['mob', 5, 2], ['agg', 3, 3]];
const handHtml = (up = 1) => handCards.map(([su, n, p], i) => card(su, n, p, i === up ? 'up' : '')).join('');

function header(text) {
  return `<div class="round num">2</div><div class="hd">${text}</div><div class="amb">ambizioni · Corte</div>`;
}

const scenes = {
  a() {
    const me = seats.me;
    return `${header('Preludio: spendi risorse, poi le azioni della carta')}
    <div style="position:absolute;left:calc(10*var(--u));top:calc(70*var(--u));display:grid;gap:calc(14*var(--u));transform-origin:0 0;transform:scale(.72)">
      ${board({ ...seats.r1, mini: true, style: 'width:calc(640*var(--u))' })}
      ${board({ ...seats.r2, mini: true, style: 'width:calc(640*var(--u))' })}
    </div>
    <div class="played" style="left:calc(510*var(--u));top:calc(90*var(--u))">${card('adm', 7, 1, 'sm')}<span class="tag" style="font-size:calc(10*var(--u))">Supera</span></div>
    <div class="played" style="left:calc(510*var(--u));top:calc(290*var(--u))">${card('agg', 2, 1, 'sm back')}<span class="tag" style="font-size:calc(10*var(--u))">Copia</span></div>
    <div class="tucked" style="left:calc(560*var(--u));bottom:calc(242*var(--u))"><div class="court lit">${ic('fuel', '')}<b>Gilda</b></div><div class="court">${ic('weapons', '')}<b>Gilda</b></div><div class="court" style="border-color:#b07ce0">${ic('psionic', '')}<b>Vox</b></div></div>
    ${board({ ...me, style: 'position:absolute;left:calc(10*var(--u));bottom:calc(10*var(--u));width:calc(820*var(--u))', live: ['fuel', 'material', 'weapons'], glow: [0, 1, 2] })}
    <div class="played" style="left:calc(860*var(--u));bottom:calc(70*var(--u))"><span class="tag">Guida</span>${card('con', 5, 3)}<span class="pipsleft">✦<i>✦</i><i>✦</i></span></div>
    <div class="hand" style="left:calc(1010*var(--u));bottom:calc(16*var(--u))">${handHtml(1)}</div>
    <div class="frame tip pointer down" style="left:calc(150*var(--u));bottom:calc(282*var(--u));--px:calc(40*var(--u))">
      <h4>${ic('fuel').replace('class="ic"', 'style="width:20px;display:inline;vertical-align:-4px"')} Carburante · spazio 1</h4>
      <p>Preludio: spendilo per <b>Muovi</b>.</p><p class="sub">Razzia: costa 3 chiavi a chi la prende.</p>
      <div class="btns"><span class="btn primary">Muovi</span><span class="btn">Annulla</span></div>
    </div>
    <div class="note" style="left:calc(860*var(--u));bottom:calc(300*var(--u))"><span class="k">1</span><b>Plancia come quella vera</b>: 6 spazi con le chiavi, le città sopra gli spazi 3–6, gli spazi +2 e +3; sotto, le 5 azioni del Preludio (l'agente copre quella in Oltraggio), trofei e prigionieri.</div>
    <div class="note" style="left:calc(1210*var(--u));bottom:calc(300*var(--u))"><span class="k">2</span><b>Carta giocata</b> a fianco della plancia, col modo (Guida/Supera/Copia) e le azioni rimaste. <b>Mano</b> libera, senza riquadro: la carta sotto il mouse si alza.</div>
    <div class="note" style="left:calc(560*var(--u));top:calc(80*var(--u))"><span class="k">3</span><b>Rivali</b>: la stessa plancia in piccolo, con la loro carta giocata accanto (coperta se è una copia). Le carte Corte tenute stanno infilate sopra la plancia.</div>
    <div class="note" style="left:calc(380*var(--u));bottom:calc(282*var(--u));max-width:calc(260*var(--u))"><span class="k">4</span>Nel Preludio le risorse spendibili si illuminano; un clic apre la finestrella con l'azione.</div>
    <div class="title">A · Plancia fedele</div>`;
  },
  b() {
    const rp = (su, n, mode, back) => `<div style="display:grid;justify-items:center;gap:2px">${card(su, n, 1, `sm${back ? ' back' : ''}`)}<span class="tag" style="font-size:calc(9*var(--u));padding:1px 6px">${mode}</span></div>`;
    return `${header('Preludio: spendi risorse, poi le azioni della carta')}
    <div style="position:absolute;left:calc(10*var(--u));top:calc(70*var(--u));display:grid;gap:calc(10*var(--u));width:calc(560*var(--u))">
      ${band({ ...seats.r1, played: rp('adm', 7, 'Supera') })}
      ${band({ ...seats.r2, played: rp('agg', 2, 'Copia', true) })}
    </div>
    <div class="frame tip" style="left:calc(590*var(--u));top:calc(70*var(--u));max-width:none;width:calc(830*var(--u))">
      <h4>Giocatore 2 · plancia</h4>
      <div style="transform:scale(.92);transform-origin:0 0;margin-bottom:calc(-22*var(--u))">${board({ ...seats.r1, style: 'width:calc(820*var(--u));box-shadow:none' })}</div>
      <p class="sub">Carte Corte: Gilda Psionica, Gilda Reliquie (passa sopra per ingrandirle).</p>
    </div>
    ${band({ ...seats.me, trophyN: 3, captiveN: 1, courts: [['fuel'], ['weapons'], ['psionic']], style: 'position:absolute;left:calc(10*var(--u));bottom:calc(10*var(--u));width:calc(620*var(--u))' })}
    <div class="played" style="left:calc(650*var(--u));bottom:calc(16*var(--u))"><span class="tag">Guida</span>${card('con', 5, 3)}<span class="pipsleft">✦<i>✦</i><i>✦</i></span></div>
    <div class="hand" style="left:calc(800*var(--u));bottom:calc(16*var(--u))">${handHtml(2)}</div>

function myCourt(cards) {
  const cc = cards.map(([k, label, r, name, lit], i) => `<div class="cc ${k}${lit ? ' lit' : ''}${i === 2 ? ' up' : ''}"><b>${label}<br>${name}</b><span class="art">${ic(r, '')}</span><span class="ft"><span>${k === 'guild' ? '⚷ 2' : ''}</span>${ic(r, '')}</span></div>`).join('');

}
/** Overlaps the items of each [data-fan] row only as much as they need to fit (a small gap otherwise). */
function fitFans() {
  for (const row of document.querySelectorAll('[data-fan]')) {
    const items = [...row.children];
    if (items.length < 2) continue;
    items.forEach((el) => { el.style.marginLeft = ''; });
    const w = items[0].getBoundingClientRect().width;
    const avail = row.getBoundingClientRect().width;
    const gap = Math.min(w * 0.06, (avail - w * items.length) / (items.length - 1));
    items.slice(1).forEach((el) => { el.style.marginLeft = `${gap}px`; });
  }
}
addEventListener('resize', fitFans);

function show() {
  const k = (location.hash || '#a').slice(1);
  document.getElementById('stage').innerHTML = (scenes[k] || scenes.a)();
  fitFans();
}
addEventListener('hashchange', show);
